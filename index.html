<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة محمد ومي - أسئلة محرجة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap');

        body {
            font-family: 'Changa', sans-serif;
            background: #1a1a1a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: white;
        }

        .container {
            background: #2d2d2d;
            padding: 35px;
            border-radius: 30px;
            box-shadow: 0 15px 50px rgba(255, 77, 109, 0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 2px solid #ff4d6d;
        }

        h1 { color: #ff4d6d; font-size: 26px; margin-bottom: 10px; }
        .names { color: #ffd1d1; font-size: 18px; margin-bottom: 20px; }

        #question-display {
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 77, 109, 0.1);
            border-radius: 20px;
            border-right: 5px solid #ff4d6d;
            line-height: 1.6;
            transition: 0.3s;
        }

        button {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        button:active { transform: scale(0.98); }
        button:hover { background: #ff758f; box-shadow: 0 0 20px rgba(255, 77, 109, 0.4); }

        .warning { font-size: 12px; color: #ffb3c1; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔥 أسئلة محرجة جداً 🔥</h1>
    <div class="names">محمد ❤️ مي</div>
    
    <div id="question-display">
        مستعدين للفضيحة؟ <br> اضغطوا على الزر!
    </div>

    <button id="next-btn">السؤال التالي 💀</button>
    
    <div class="warning">ملاحظة: الجواب لازم يكون صريح وبدون زعل!</div>
</div>

<script>
    const questions = [
        "محمد، شنو أكثر شي يخليك تغار على مي لدرجة تطلع من طورك؟",
        "مي، شنو الكذبة البيضاء اللي كذبتيها على محمد ولحد الآن ما يعرفها؟",
        "محمد، لو مي فتشت موبايلك هسه بكل زاوية، شراح تلاقى شي يربكك؟",
        "مي، بصراحة.. منو أكثر واحد من أصدقاء محمد تحسيه (ثقيل دم) وماتطيقيه؟",
        "محمد، يا خصلة بمي تنرفزك لدرجة ودك تسوي موبايلك صامت وتنام؟",
        "مي، شنو أول انطباع 'سيء' أخذتيه عن محمد وأول ما شفتيه؟",
        "لو خيروكم: تنهون علاقتكم هسه لو كل واحد ينطي الباسورد مال فيسبوك للثاني؟",
        "محمد، شوكت آخر مرة فكرت تسوي (بلوك) لمي ب لحظة عصبية؟",
        "مي، لو محمد صار (مفلس) لمدة سنة، تبقين وياه لو 'الحب ما يوكّل خبز'؟",
        "منو بينا اللي ريحته من يگعد من النوم تخلي الثاني يطفر من الغرفة؟ 😂",
        "محمد، شنو الحركة اللي تسويها مي وتحسها 'دلع زايد' وما لايق عليها؟",
        "مي، يا سر حكاه الج محمد ورحتي كلتيه لصديقتج المقربة فوراً؟",
        "محمد، لو مي طلبت منك تبيع سيارتك أو أغلى شي عندك علمود تسافرون، تسويها؟",
        "بصراحة، منو بينا اللي 'عينه زايغة' أكثر بالسوق أو بالمولات؟ 🌚"
    ];

    const btn = document.getElementById('next-btn');
    const display = document.getElementById('question-display');

    btn.addEventListener('click', () => {
        display.style.opacity = "0";
        setTimeout(() => {
            const randomIndex = Math.floor(Math.random() * questions.length);
            display.innerText = questions[randomIndex];
            display.style.opacity = "1";
        }, 200);
    });
</script>

</body>
</html>
