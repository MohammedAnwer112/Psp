<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحقيق مع مي 🕵️‍♀️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;700&display=swap');

        body {
            font-family: 'Changa', sans-serif;
            background: #000; /* خلفية سوداء */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 3px solid #ff1493; /* إطار وردي */
        }

        h1 { color: #ff1493; font-size: 24px; margin-bottom: 5px; }
        .sub-title { color: #fff; font-size: 14px; margin-bottom: 20px; opacity: 0.8; }

        #question-box {
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 25px;
            padding: 15px;
            background: linear-gradient(145deg, #222, #111);
            border-radius: 15px;
            border-left: 5px solid #ff1493;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        button {
            background: #ff1493;
            color: white;
            border: none;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-family: 'Changa', sans-serif;
            transition: 0.2s;
            box-shadow: 0 5px 15px rgba(255, 20, 147, 0.4);
        }

        button:active { transform: scale(0.95); }
        button:hover { background: #ff4da6; }

        .pink-text { color: #ff1493; }
    </style>
</head>
<body>

<div class="container">
    <h1>تحقيق مع <span class="pink-text">مي</span> 🕵️‍♀️</h1>
    <div class="sub-title">الأسئلة برعاية محمد 😎</div>
    
    <div id="question-box">
        مي.. مستعدة للاعتراف؟ <br> اضغطي وشوفي!
    </div>

    <button onclick="drawQuestion()">السؤال التالي 🔥</button>
</div>

<script>
    const pool = [
        // سؤالك المتكرر
        "وردي لو أسود؟ 🤔",
        "وردي لو أسود؟ 🌚",
        "وردي لو أسود؟ (جاوبي بسرعة!)",
        "وردي لو أسود؟",
        
        // أسئلة موجهة لمي
        "مي، شنو أكثر شي يخليج تغارين على محمد وتسوين مشكلة من لا شيء؟",
        "مي، لو محمد كال لغيج سدي الموبايل هسه، تسديه لو تبقين تعاندين؟",
        "مي، بصراحة منو الي يسيطر على الثاني أكثر، أنتي لو محمد؟",
        "مي، يا طبع بمحمد يخليج تبتسمين غصباً عنج حتى لو كنتِ زعلانة؟",
        "مي، شنو الكلمة الي من يقولها محمد تدوخين وتنسين العتب؟",
        "مي، لو شفتي بنية حطت لايك لمحمد، شنو أول رد فعل تسويه؟ 💀",
        "مي، يا سر ضامته على محمد وتخافين يعرفه ويضحك عليج؟",
        "مي، بصراحة.. هم غسلتي مواعين وأنتي تفكرين بمحمد؟ 😂",
        "مي، لو خيروج تروحين سفرة وحدج لو تاخذين محمد وياج بس هو يدفع الحساب؟",
        "مي، شنو أكثر حركة يسويها محمد تنرفزج بس ما تحجين؟"
    ];

    function drawQuestion() {
        const box = document.getElementById('question-box');
        
        // تأثير اهتزاز بسيط عند التغيير
        box.style.transform = "rotate(-2deg)";
        
        setTimeout(() => {
            const randomIndex = Math.floor(Math.random() * pool.length);
            box.innerText = pool[randomIndex];
            box.style.transform = "rotate(0deg)";
            
            // تغيير لون النص إذا كان السؤال هو المتكرر
            if(pool[randomIndex].includes("وردي لو أسود")) {
                box.style.color = "#ff1493";
            } else {
                box.style.color = "#fff";
            }
        }, 100);
    }
</script>

</body>
</html>
